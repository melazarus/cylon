[env]
platform = ch32v
framework = noneos-sdk
board = genericCH32X035F8U6
; turn off the compilation of the built-in debug implementation
board_build.use_builtin_debug_code = no
upload_protocol = isp
; Firmware version, reported over USB-MIDI (command 0x02) and encoded into
; the USB serial number. Bump these for a release.
build_flags =
    -DVERSION_MAJOR=\"1\"
    -DVERSION_MINOR=\"0\"
    -DVERSION_PATCH=\"0\"

[env:debug]
; verbose build with serial logging (USART1 TX = PB10, 115200 8N1)
build_flags =
    ${env.build_flags}
    -DDEBUG=1
    -Og
    -g3
    -Wall
    -Wextra

[env:release]
; DEBUG=0 keeps newlib's printf and the UART retarget out of the image
build_flags =
    ${env.build_flags}
    -DDEBUG=0
    -Os
    -Wall
    -Wextra
